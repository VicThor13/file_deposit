<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor Portfolio - Terminal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="header-buttons">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <div class="header-title">victor@portfolio: ~</div>
            <select id="lang-select">
                <option value="fr">FR</option>
                <option value="en">EN</option>
            </select>
        </div>
        <div class="terminal-body" id="terminal-body">
            <div id="output">
                <div class="command-line">
                    <span class="prompt">victor@portfolio:~$</span> ./welcome_script.sh
                </div>
                <div class="response">
                    <pre class="ascii-art">
  _      __     __               
 | | /| / /__  / /__________  __ _  ___ 
 | |/ |/ / _ \/ / __/ _ \  / /  ' \/ -_)
 |__/|__/\___/_/\__/\___/_/ /_/_/_/\__/ 
                    </pre>
                    <p><span data-i18n="text72">Hello World ツ</span></p>
                    <p><span data-i18n="text99"></span></p>
                    <p data-i18n="help_welcome"></p>
                </div>
            </div>
            <div class="input-area">
                <span class="prompt">victor@portfolio:~$</span>
                <input type="text" id="cmd-input" autofocus autocomplete="off">
            </div>
        </div>
    </div>
    <script src="langswitch.js"></script>
</body>
</html>
